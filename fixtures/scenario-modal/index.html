<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Scenario Modal Fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui}
header{padding:20px;background:#111;color:#fff}
.btn{background:#7c5cff;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-content{background:#fff;padding:24px;border-radius:12px;width:90%;max-width:400px;position:relative}
.modal-content .close{position:absolute;top:8px;right:12px;background:none;border:0;font-size:20px;cursor:pointer}
.overlap-badge{position:absolute;top:10px;right:10px;background:#111;color:#fff;padding:4px 8px;border-radius:999px}
.hero{padding:40px 20px}
</style>
</head>
<body>
<header><strong>ModalDemo</strong></header>
<div class="hero"><button id="openModal" class="btn">Open Modal</button><p>Modal contains overlapping badges to test detection after interaction.</p></div>
<div id="myModal" class="modal" aria-hidden="true"><div class="modal-content"><button class="close" id="closeModal">×</button><h2>Modal Title</h2><p>Content here</p><span class="overlap-badge" style="right:22px;background:#ff4d6a">HOT</span><span class="overlap-badge">NEW</span></div></div>
<script>
document.getElementById('openModal').addEventListener('click',()=>{document.getElementById('myModal').classList.add('open');document.getElementById('myModal').setAttribute('aria-hidden','false');});
document.getElementById('closeModal').addEventListener('click',()=>{document.getElementById('myModal').classList.remove('open');document.getElementById('myModal').setAttribute('aria-hidden','true');});
</script>
</body>
</html>
