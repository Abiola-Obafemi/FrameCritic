<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Scenario Scroll Fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui}
#header{position:sticky;top:0;background:#111;color:#fff;padding:16px}
#scrollBox{height:200px;overflow:auto;border:2px solid #7c5cff;margin:20px}
.inner{height:600px;background:linear-gradient(to bottom,#fff,#e6e8ee);padding:20px}
#target{margin-top:400px;padding:16px;background:#ff4d6a;color:#fff;border-radius:8px}
#out{margin:20px;padding:12px;background:#eef;border-radius:8px;min-height:40px}
.spacer{height:1200px;background:#fafafa;padding:20px}
</style>
</head>
<body>
<div id="header">Scroll Fixture</div>
<div id="scrollBox"><div class="inner"><p>Scrollable box content top</p><div id="target">TARGET at bottom of scrollBox — should be scrolled into view</div></div></div>
<div id="out">not scrolled</div>
<div class="spacer">Spacer for window scroll — scroll y should change after scroll action</div>
<script>
const box=document.getElementById('scrollBox');
const out=document.getElementById('out');
if(box){
  box.addEventListener('scroll',()=>{ out.textContent='box scrolled:'+box.scrollTop; });
}
window.addEventListener('scroll',()=>{
  if(window.scrollY>100) out.textContent='window scrolled:'+window.scrollY;
});
document.getElementById('target').addEventListener('click',()=>{ out.textContent='target clicked after scroll'; });
</script>
</body>
</html>
